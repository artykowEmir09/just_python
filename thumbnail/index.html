<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
       
    <title>Thumbnail Maker</title>

    <link rel="stylesheet"
          href="style.css">
</head>

<body>

    <!-- HEADER -->

    <header>

        <div class="logo">
            THUMB<span>LAB</span>
        </div>

        <div class="header-right">

            <div class="status">
                ● ONLINE
            </div>

            <button id="downloadBtn">
                ↓ DOWNLOAD PNG
            </button>

        </div>

    </header>


    <!-- MAIN -->

    <main>

        <!-- LEFT PANEL -->

        <aside class="sidebar">

            <h2>THUMBNAIL</h2>

            <!-- IMAGE -->

            <div class="control">

                <label>
                    IMAGE
                </label>

                <input
                    type="file"
                    id="imageInput"
                    accept="image/*">

            </div>


            <!-- TITLE -->

            <div class="control">

                <label>
                    MAIN TITLE
                </label>

                <input
                    type="text"
                    id="titleInput"
                    value="YOU WON'T BELIEVE THIS!">

            </div>


            <!-- SUBTITLE -->

            <div class="control">

                <label>
                    SUBTITLE
                </label>

                <input
                    type="text"
                    id="subtitleInput"
                    value="THE TRUTH REVEALED">

            </div>


            <!-- FONT SIZE -->

            <div class="control">

                <div class="label-row">

                    <label>
                        TITLE SIZE
                    </label>

                    <span id="sizeValue">
                        100
                    </span>

                </div>

                <input
                    type="range"
                    id="sizeInput"
                    min="40"
                    max="180"
                    value="100">

            </div>


            <!-- TEXT COLOR -->

            <div class="control">

                <label>
                    TEXT COLOR
                </label>

                <div class="color-row">

                    <button
                        class="color active"
                        data-color="#ffffff"
                        style="background:#ffffff">
                    </button>

                    <button
                        class="color"
                        data-color="#ffff00"
                        style="background:#ffff00">
                    </button>

                    <button
                        class="color"
                        data-color="#00ffff"
                        style="background:#00ffff">
                    </button>

                    <button
                        class="color"
                        data-color="#ff3131"
                        style="background:#ff3131">
                    </button>

                    <button
                        class="color"
                        data-color="#ff00ff"
                        style="background:#ff00ff">
                    </button>

                </div>

            </div>


            <!-- THEMES -->

            <div class="control">

                <label>
                    THEMES
                </label>

                <div class="themes">

                    <button
                        class="theme"
                        data-bg="#111111"
                        data-accent="#ff3131">
                        🔥 FIRE
                    </button>

                    <button
                        class="theme"
                        data-bg="#071b30"
                        data-accent="#00ffff">
                        ❄️ CYBER
                    </button>

                    <button
                        class="theme"
                        data-bg="#28104e"
                        data-accent="#ff00ff">
                        💜 NEON
                    </button>

                    <button
                        class="theme"
                        data-bg="#173d18"
                        data-accent="#39ff14">
                        🟢 MATRIX
                    </button>

                </div>

            </div>


            <!-- BACKGROUND -->

            <div class="control">

                <label>
                    BACKGROUND
                </label>

                <input
                    type="color"
                    id="backgroundInput"
                    value="#111111">

            </div>


            <!-- ZOOM -->

            <div class="control">

                <div class="label-row">

                    <label>
                        IMAGE ZOOM
                    </label>

                    <span id="zoomValue">
                        100%
                    </span>

                </div>

                <input
                    type="range"
                    id="zoomInput"
                    min="50"
                    max="200"
                    value="100">

            </div>


            <button
                id="resetBtn"
                class="reset">
                RESET
            </button>

        </aside>

        <section class="workspace">

            <div class="canvas-container">

                <canvas
                    id="thumbn
