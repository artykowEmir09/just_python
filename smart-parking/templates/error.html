{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 text-center">
        <div class="card p-5 border-danger shadow-sm">
            <h1 class="display-3 fw-bold text-danger">{{ code }}</h1>
            <h4 class="fw-bold mb-3">Security Error Handled</h4>
            <p class="text-muted">{{ message }}</p>
            <div class="mt-4">
                <a href="/" class="btn btn-primary px-4">Return Home</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
